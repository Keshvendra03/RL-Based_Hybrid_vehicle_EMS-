  - id: PHASE4-gated-multiseed
    date: 2026-08-26
    status: complete
    hypothesis: >
      Exploration deadlock: engine-OFF at 30-50 Nm is 3.9-6.7 sigma from the
      actor mean under the linear map, so it is never proposed and the critic
      never learns it. A feasibility-GATED mode-aware reparameterization makes
      OFF reachable (1.0-1.7 sigma) only where the motor envelope allows it.
    isolated_variable: action_map (linear -> modeaware_gated)
    algorithm: SAC
    gamma: 0.20
    n_step: 1
    eq_factor: {NEDC: 0.2717, FTP75: 0.4981}
    k_fb: 1.656
    gradient_steps: 16
    lookahead: 5
    training_steps: 148840
    seeds: [0, 1, 2]
    results:
      NEDC:  {mean: 3.8824, std: 0.1371, min: 3.7311, max: 3.9985,
              vs_linear: +0.1097, cohen_d: -1.11, charge_sustaining: "1/3",
              violations: 0, off_pct: 41.6, assist_pct: 8.9,
              verdict: "REGRESSION -- SoC runaway +11.41/+8.37pp on seeds 0/2"}
      FTP75: {mean: 3.2460, std: 0.0434, min: 3.2088, max: 3.2937,
              vs_linear: -0.1361, cohen_d: +2.02, charge_sustaining: "3/3",
              violations: 0, off_pct: 43.2, assist_pct: 4.6,
              verdict: "WIN -- best seed 3.2088 BEATS rule-based 3.2323 (-0.7%)"}
    interpretation: >
      gamma x action_map INTERACTION. At gamma=0.20 the terminal
      charge-sustaining penalty is invisible (discount 1e-07 ten steps out), so
      the only SoC control is the per-step k_fb costate. The gated map grants
      more OFF freedom than that weak control can contain on NEDC; FTP75 is
      immune because denser braking (REGEN 25.7%) supplies regen without LPS.
    next: "E12 -- raise k_fb for gated+gamma=0.20 on NEDC (one variable)"

