# Experiment Registry — RL-Based Hybrid Vehicle EMS
#
# Machine-readable record of every training experiment. An experiment is only
# VALID if it can be reconstructed from the metadata below.
#
# Metric definitions:
#   v_ce_equiv        : PRIMARY objective, L/100km, from the validated EFC block
#   d_soc_pp          : (SoC_final - 50%) in percentage points
#   off/assist/lps/regen_pct : % of MOVING steps (results/evaluate_policy.py)
# All metrics are produced by the single authoritative evaluator
#   `python -m results.evaluate_policy` -- no controller-specific shortcuts.

