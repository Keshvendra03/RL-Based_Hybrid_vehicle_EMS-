# Unit conversion between ECMS costate and env eq_factor (RL_DIAGNOSTIC_REPORT §2)
#   implicit_lambda(eq_factor=1.0) = K_ELEC_L_PER_J / (K_FUEL_L_PER_KG / H_u) = 4.8309
#   eq_factor_env = lambda_ECMS / 4.8309 ;  k_fb_env = k_fb_ECMS / 4.8309
reward_unit_conversion:
  implicit_lambda_at_eq_factor_1: 4.8309
  eq_factor_matching_ecms:
    NEDC: 0.2717    # 1.3125 / 4.8309
    FTP75: 0.4981   # 2.4062 / 4.8309
  k_fb_matching_ecms: 1.656   # 8.0 / 4.8309

